<div class="card-container">
    <span class="ar-card-header">
        {{header}}
    </span>
    <span class="ar-card-body">
        {{body}}
    </span>
    <button *ngIf="buttonLabel.length > 0" mat-stroked-button class="card-button" (click)="handleButtonClick($event)">{{buttonLabel}}</button>
</div>
